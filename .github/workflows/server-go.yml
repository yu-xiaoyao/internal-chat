name: Build Server Go

on:
  push:
    branches: [ main , dev ]
    tags:
      - '*'
    paths:
      - 'server-go/**'
  pull_request:
    branches: [ main , dev ]
    tags:
      - '*'
    paths:
      - 'server-go/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server-go

    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Install dependencies
      run: go mod download

    - name: go.mod
      run: go mod tidy

    - name: Build for Linux
      run: GOOS=linux GOARCH=amd64 go build -o bin/server-go-linux-amd64

    - name: Build for Windows
      run: GOOS=windows GOARCH=amd64 go build -o bin/server-go-windows-amd64.exe

    - name: Build for MacOS
      run: GOOS=darwin GOARCH=amd64 go build -o bin/server-go-darwin-amd64

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: startsWith(github.ref, 'refs/tags/')
      with:
        name: server-go
        path: |
          bin/server-go-linux-amd64
          bin/server-go-windows-amd64.exe
          bin/server-go-darwin-amd64

    - name: Release artifacts
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          bin/server-go-linux-amd64
          bin/server-go-windows-amd64.exe
          bin/server-go-darwin-amd64
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}